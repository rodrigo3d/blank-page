<head>
  <!-- Required Meta Tags Always Come First -->
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Title -->
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="author" content="Rodrigo Ribeiro - me@rodrigo3d.com" />
  <meta name="generator" content="Jekyll v{{ jekyll.version }}" />
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />

  <!-- Google Authorship Markup -->
  <meta name="google-site-verification" content="{{ site.user.google-site-verification }}" />
  <link rel="author" href="https://plus.google.com/+{{ site.user.google-plus }}?rel=author" />

  <!-- Social: Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@{{ site.user.twitter }}" />
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta name="twitter:description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  {% if page.image %}<meta property="twitter:image:src" content="{{ site.url }}{{ page.image }}" />{% else %}<meta property="twitter:image:src" content="{{ "/assets/img/site-image.png" | absolute_url }}" />{% endif %}

  <!-- Social: Facebook / Open Graph -->
  <meta property="fb:admins" content="{{ site.facebook-admins }}" />
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  {% if page.image %}<meta property="og:image" content="{{ site.url }}{{ page.image }}" />{% else %}<meta property="og:image" content="{{ "/assets/img/site-image.png" | absolute_url }}" />{% endif %}
  <meta property="og:description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:site_name" content="{{ site.title }}" />

  <!-- Social: Google+ / Schema.org  -->
  <meta itemprop="name" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta itemprop="image" content="{{ "/assets/img/site-image.png" | absolute_url }}" />
  <meta itemprop="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ "/assets/img/icons/favicon.png" | absolute_url }}" />
  <link rel="shortcut icon" type="image/png" href="{{ "/assets/img/icons/favicon.png" | absolute_url }}" />

  <!-- Android Lolipop Theme Color -->
  <meta name="theme-color" content="{{ site.lolipop-theme-color }}" />

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,500,600,700" />

  <!-- CSS Global Compulsory -->
  <link rel="stylesheet" href="{{ "/assets/vendor/bootstrap/bootstrap.min.css" | absolute_url }}" />

  <!-- CSS Global -->
  <link rel="stylesheet" href="{{ "/assets/css/main.min.css" | absolute_url }}" />

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}" />
</head>
